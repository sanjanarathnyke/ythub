<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YTHub - YouTube Video Downloader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f1f5f9;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --accent: #ec4899;
            --accent-dark: #db2777;
            --accent-darker: #be185d;
            --success: #22c55e;
            --error-bg: #fff1f2;
            --error-text: #e11d48;
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
            --radius: 18px;
            --radius-sm: 12px;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: var(--text);
            display: flex;
            flex-direction: column;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 12px 16px 8px;
            gap: 10px;
            max-width: 960px;
            margin: 0 auto;
            width: 100%;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .logo {
            font-family: 'Caveat', cursive;
            font-size: 2.4rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1;
        }

        .logo span { color: var(--accent); }

        .tagline {
            font-size: 0.82rem;
            color: var(--text-muted);
            border-left: 2px solid var(--border);
            padding-left: 12px;
        }

        /* Main */
        .main {
            display: flex;
            gap: 14px;
            flex: 1;
            min-height: 0;
        }

        /* Left panel */
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        /* Input card */
        .input-card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px;
            flex-shrink: 0;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .url-input {
            flex: 1;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #f8fafc;
        }

        .url-input::placeholder { color: var(--text-light); }

        .url-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(236,72,153,0.15);
            background: #fff;
        }

        .fetch-btn {
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            border: none;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
            transition: transform 0.15s, box-shadow 0.15s;
            flex-shrink: 0;
        }

        .fetch-btn:hover {
            background: linear-gradient(135deg, var(--accent-dark) 0%, var(--accent-darker) 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(236,72,153,0.3);
        }

        .fetch-btn:active { transform: translateY(0); }

        /* Status bar */
        .status-bar {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.84rem;
            flex-shrink: 0;
            margin-top: 8px;
        }

        .status-bar.loading {
            display: flex;
            background: #f0f9ff;
            color: #0369a1;
        }

        .status-bar.error {
            display: flex;
            background: var(--error-bg);
            color: var(--error-text);
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #bae6fd;
            border-top-color: #0369a1;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Video card */
        .video-card {
            display: none;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 14px;
            flex: 1;
            min-height: 0;
            animation: fadeSlide 0.35s ease-out;
            overflow: hidden;
        }

        .video-card.visible { display: flex; flex-direction: column; gap: 10px; }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .video-inner {
            display: flex;
            gap: 14px;
            flex: 1;
            min-height: 0;
        }

        .thumbnail-wrap {
            width: 200px;
            flex-shrink: 0;
        }

        .thumbnail-wrap img {
            width: 100%;
            border-radius: var(--radius-sm);
            object-fit: cover;
            display: block;
        }

        .video-details {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .video-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-desc {
            font-size: 0.78rem;
            color: var(--text-muted);
            background: #f8fafc;
            border-radius: 10px;
            padding: 8px 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .format-label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .format-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .format-btn {
            padding: 6px 14px;
            border-radius: 8px;
            border: 2px solid var(--border);
            background: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            transition: all 0.15s;
        }

        .format-btn:hover { border-color: var(--accent); color: var(--accent); }

        .format-btn.selected {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border-color: transparent;
            color: #fff;
        }

        .format-btn .ext {
            font-size: 0.7rem;
            font-weight: 400;
            opacity: 0.75;
            margin-left: 4px;
        }

        .download-btn {
            margin-top: auto;
            padding: 10px;
            border-radius: var(--radius-sm);
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .download-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .download-btn:not(:disabled):hover {
            background: linear-gradient(135deg, var(--accent-dark), var(--accent-darker));
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(236,72,153,0.3);
        }

        /* Empty state */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            color: var(--text-muted);
        }

        .empty-icon { font-size: 3rem; opacity: 0.35; }
        .empty-text  { font-size: 0.9rem; opacity: 0.7; }

        /* Success */
        .success-card {
            display: none;
            flex: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
            padding: 20px;
            animation: fadeSlide 0.35s ease-out;
        }

        .success-card.visible { display: flex; }
        .success-icon { font-size: 3rem; }
        .success-title { font-size: 1.2rem; font-weight: 700; color: #15803d; }
        .success-msg   { font-size: 0.85rem; color: #4ade80; }

        .reset-btn {
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            border: none;
            background: var(--success);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: background 0.15s, transform 0.15s;
            margin-top: 4px;
        }

        .reset-btn:hover { background: #16a34a; transform: translateY(-1px); }

        /* Right panel */
        .right-panel {
            width: 190px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .carousel-card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 14px 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .carousel-title {
            font-family: 'Caveat', cursive;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 10px;
            text-align: center;
        }

        .carousel-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow: hidden;
        }

        .cat-item {
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Caveat', cursive;
            font-size: 1.05rem;
            color: #fff;
            font-weight: 600;
            flex: 1;
            min-height: 0;
            transition: transform 0.15s, box-shadow 0.15s;
            cursor: default;
        }

        .cat-item:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
        }

        /* Footer */
        .footer {
            text-align: center;
            font-family: 'Caveat', cursive;
            font-size: 1rem;
            color: var(--text-light);
            flex-shrink: 0;
            padding-bottom: 2px;
        }
    </style>
</head>
<body>
    <div class="app">

        <!-- Header -->
        <header class="header">
            <div class="logo">YT<span>Hub</span></div>
            <p class="tagline">Download YouTube videos in high quality</p>
        </header>

        <!-- Main -->
        <div class="main">

            <!-- Left panel -->
            <div class="left-panel">

                <!-- URL Input -->
                <div class="input-card">
                    <div class="input-row">
                        <input
                            type="text"
                            id="urlInput"
                            class="url-input"
                            placeholder="Paste YouTube URL here…"
                            onpaste="setTimeout(fetchVideoInfo, 50)"
                            onkeydown="if(event.key==='Enter') fetchVideoInfo()"
                        >
                        <button class="fetch-btn" id="fetchBtn" onclick="fetchVideoInfo()">Get Info</button>
                    </div>
                    <div id="statusBar" class="status-bar">
                        <div class="spinner" id="spinner"></div>
                        <span id="statusText"></span>
                    </div>
                </div>

                <!-- Empty state -->
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">🎬</div>
                    <p class="empty-text">Paste a YouTube URL above to get started</p>
                </div>

                <!-- Video Info -->
                <div class="video-card" id="videoCard">
                    <div class="video-inner">
                        <div class="thumbnail-wrap">
                            <img id="thumbnail" src="" alt="Thumbnail">
                        </div>
                        <div class="video-details">
                            <h2 class="video-title" id="videoTitle"></h2>
                            <p class="video-desc" id="videoDesc"></p>
                            <p class="format-label">Select Quality</p>
                            <div class="format-grid" id="formatList"></div>
                            <button class="download-btn" id="downloadBtn" onclick="downloadVideo()" disabled>
                                ⬇ Download Video
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Success -->
                <div class="success-card" id="successCard">
                    <div class="success-icon">✅</div>
                    <h3 class="success-title">Download Started!</h3>
                    <p class="success-msg">Your video download has been triggered.</p>
                    <button class="reset-btn" onclick="resetForm()">Download Another</button>
                </div>

            </div>

            <!-- Right panel -->
            <div class="right-panel">
                <div class="carousel-card">
                    <div class="carousel-title">📂 Categories</div>
                    <div class="carousel-list" id="carouselList"></div>
                </div>
            </div>

        </div>

        <!-- Footer -->
        <footer class="footer">Developed by VertexCore AI · Download responsibly</footer>
    </div>

    <script>
        const API_BASE = 'http://localhost:3001/api';
        let currentVideoInfo = null;
        let selectedFormat = null;

        const categories = [
            { title: '🎵 Music',     color: 'linear-gradient(135deg,#f472b6,#ec4899)' },
            { title: '📚 Tutorials', color: 'linear-gradient(135deg,#60a5fa,#6366f1)' },
            { title: '🎮 Gaming',    color: 'linear-gradient(135deg,#34d399,#059669)' },
            { title: '🎙 Podcasts',  color: 'linear-gradient(135deg,#a78bfa,#7c3aed)' },
            { title: '🎥 Vlogs',     color: 'linear-gradient(135deg,#fb923c,#f59e0b)' },
        ];

        function initCarousel() {
            document.getElementById('carouselList').innerHTML = categories.map(c => `
                <div class="cat-item" style="background:${c.color}">${c.title}</div>
            `).join('');
        }

        function showStatus(type, msg) {
            const bar  = document.getElementById('statusBar');
            const txt  = document.getElementById('statusText');
            const spin = document.getElementById('spinner');
            bar.className = 'status-bar ' + type;
            txt.textContent = msg;
            spin.style.display = type === 'loading' ? 'block' : 'none';
        }

        function hideStatus() {
            document.getElementById('statusBar').className = 'status-bar';
        }

        function setView(view) {
            const empty   = document.getElementById('emptyState');
            const video   = document.getElementById('videoCard');
            const success = document.getElementById('successCard');
            empty.style.display = view === 'empty' ? '' : 'none';
            video.classList.toggle('visible', view === 'video');
            success.classList.toggle('visible', view === 'success');
        }

        async function fetchVideoInfo() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) {
                showStatus('error', 'Please paste a YouTube URL');
                return;
            }

            showStatus('loading', 'Fetching video info…');
            setView('empty');

            try {
                const healthRes = await fetch(`${API_BASE}/health`);
                const health    = await healthRes.json();
                if (!healthRes.ok || !health.ytdlpAvailable) {
                    throw new Error('Backend not ready. Make sure the server is running and yt-dlp is installed.');
                }

                const response = await fetch(`${API_BASE}/video-info?url=${encodeURIComponent(url)}`);
                const data     = await response.json();

                if (!response.ok) throw new Error(data.error || 'Failed to fetch video info');

                currentVideoInfo = data;
                displayVideoInfo(data);
                hideStatus();

            } catch (err) {
                showStatus('error', err.message || 'Failed to fetch. Check the URL and try again.');
                setView('empty');
            }
        }

        function displayVideoInfo(info) {
            document.getElementById('thumbnail').src        = info.thumbnail;
            document.getElementById('videoTitle').textContent = info.title;
            document.getElementById('videoDesc').textContent  = info.description || 'No description available';

            const formats = info.formats || [];
            const allowed = ['144p','256p','360p','480p'];
            const seen    = new Set();
            const unique  = formats.filter(f => {
                if (!seen.has(f.quality) && allowed.includes(f.quality)) { seen.add(f.quality); return true; }
                return false;
            });

            const listEl = document.getElementById('formatList');
            listEl.innerHTML = unique.length === 0
                ? `<p style="color:var(--text-muted);font-size:0.8rem;">No supported formats found.</p>`
                : unique.map(f => `
                    <button class="format-btn" onclick="selectFormat('${f.itag}')" data-itag="${f.itag}">
                        ${f.quality}<span class="ext">${f.container.toUpperCase()}</span>
                    </button>
                `).join('');

            selectedFormat = null;
            document.getElementById('downloadBtn').disabled = true;
            setView('video');
        }

        function selectFormat(itag) {
            selectedFormat = itag;
            document.querySelectorAll('.format-btn').forEach(btn =>
                btn.classList.toggle('selected', btn.dataset.itag == itag)
            );
            document.getElementById('downloadBtn').disabled = false;
        }

        async function downloadVideo() {
            if (!currentVideoInfo || !selectedFormat) return;
            const url = document.getElementById('urlInput').value.trim();
            const btn = document.getElementById('downloadBtn');
            btn.textContent = 'Starting…';
            btn.disabled = true;

            try {
                const link = document.createElement('a');
                link.href  = `${API_BASE}/download?url=${encodeURIComponent(url)}&itag=${selectedFormat}`;
                link.download = '';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => setView('success'), 1500);
            } catch (err) {
                showStatus('error', 'Download failed. Please try again.');
                btn.textContent = '⬇ Download Video';
                btn.disabled = false;
            }
        }

        function resetForm() {
            document.getElementById('urlInput').value = '';
            currentVideoInfo = null;
            selectedFormat   = null;
            hideStatus();
            setView('empty');
        }

        document.addEventListener('DOMContentLoaded', () => {
            initCarousel();
            setView('empty');
        });
    </script>
</body>
</html>
