<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Hub — YouTube Downloader</title>
<meta name="description" content="Paste a YouTube link, pick a format and quality, download. Fast, simple, free.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%23ff6b6b'/><stop offset='100%25' stop-color='%23ff0000'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(%23g)'/><polygon points='40,25 40,75 78,50' fill='%2306171b'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface-2: #222222;
    --line: #2a2a2a;
    --text: #f1f1f1;
    --muted: #9aa0a6;
    --red: #ff0000;
    --red-deep: #cc0000;
    --red-light: #ff6b6b;
    --red-soft: #e04040;
    --blue: #3ea6ff;
    --blue-deep: #2c7bd6;
    --shadow: 0 24px 50px -24px rgba(0,0,0,.7);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(900px 460px at 10% -10%, rgba(255,0,0,.08) 0%, transparent 60%),
      radial-gradient(900px 460px at 100% 0%, rgba(62,166,255,.06) 0%, transparent 55%),
      var(--bg);
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: var(--text);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* ── ambient decorations ── */
  .grid-overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .35;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 42px 42px;
  }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(30px); opacity: .5; pointer-events: none;
  }
  .glyph {
    position: absolute; font-family: 'Caveat', cursive; opacity: .16; pointer-events: none;
    animation: drift 7s ease-in-out infinite;
  }
  @keyframes drift {
    0%   { transform: translateY(0) rotate(0deg); }
    50%  { transform: translateY(-18px) rotate(6deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }
  @keyframes driftSlow {
    0%   { transform: translateY(0) translateX(0); }
    50%  { transform: translateY(16px) translateX(-12px); }
    100% { transform: translateY(0) translateX(0); }
  }
  @keyframes blink {
    0%, 100% { opacity: 1; } 50% { opacity: .2; }
  }
  @keyframes reveal { to { opacity: 1; transform: translateY(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  @keyframes scan { 0% { background-position: 0 0, 0 0; } 100% { background-position: 40px 40px, 0 0; } }

  /* ── layout ── */
  header {
    max-width: 1180px; margin: 0 auto; padding: 34px 28px 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
    position: relative; z-index: 2;
  }
  .logo {
    font-family: 'Caveat', cursive; font-weight: 700; font-size: 44px; line-height: 1;
    display: flex; align-items: baseline; gap: 6px;
  }
  .logo span {
    background: linear-gradient(100deg, var(--red), var(--blue));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tagline { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .status {
    display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted);
    border: 1px solid var(--line); padding: 8px 14px; border-radius: 999px; background: var(--surface);
  }
  .status .led {
    width: 8px; height: 8px; border-radius: 50%; background: var(--blue);
    box-shadow: 0 0 10px var(--blue); animation: blink 2.4s ease-in-out infinite;
  }

  main { max-width: 1180px; margin: 0 auto; padding: 24px 28px 80px; position: relative; z-index: 2; }

  /* ── search ── */
  .search-row {
    display: flex; gap: 12px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1);
    padding: 10px; border-radius: 16px; box-shadow: var(--shadow);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .search-row input {
    flex: 1; border: none; outline: none; font-size: 15.5px; padding: 14px 18px;
    font-family: 'JetBrains Mono', monospace; color: var(--text); background: transparent;
  }
  .search-row input::placeholder { color: #565c66; }


  .hint { font-family: 'Caveat', cursive; font-size: 19px; color: #6b7280; margin: 14px 4px 0; }

  /* ── status bar ── */
  .status-bar {
    display: none; align-items: center; gap: 10px;
    margin-top: 14px; padding: 12px 18px; border-radius: 12px;
    font-size: 13.5px; background: var(--surface-2); border: 1px solid var(--line);
  }
  .status-bar.loading { display: flex; color: var(--red); }
  .status-bar.error   { display: flex; color: #f87171; }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid rgba(255,0,0,.3); border-top-color: var(--red);
    animation: spin .7s linear infinite; flex-shrink: 0;
  }

  /* ── result card ── */
  .result {
    margin-top: 28px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; padding: 26px; box-shadow: var(--shadow);
    display: grid; grid-template-columns: 260px 1fr; gap: 26px;
  }
  .result.hidden { display: none; }

  .thumb-wrap {
    position: relative; border-radius: 12px; overflow: hidden;
    aspect-ratio: 16/10; background: #0d1117;
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
  }
  .thumb-wrap img {
    width: 100%; height: 100%; object-fit: cover; display: block; opacity: .92;
    position: absolute; inset: 0;
  }
  .thumb-placeholder { color: #3a4049; font-size: 13px; font-family: 'JetBrains Mono', monospace; }
  .thumb-badge {
    position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,.7);
    color: var(--blue); font-size: 12px; padding: 3px 8px; border-radius: 6px; font-weight: 600;
    font-family: 'JetBrains Mono', monospace; border: 1px solid rgba(62,166,255,.3);
  }
  .thumb-dl-btn {
    position: absolute; top: 8px; right: 8px;
    width: 32px; height: 32px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(0,0,0,.5); color: #fff;
    cursor: pointer; font-size: 14px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    transition: all .2s ease; opacity: 1;
  }
  .thumb-dl-btn:hover {
    background: rgba(255,107,107,.4); border-color: rgba(255,107,107,.6); transform: scale(1.1);
  }

  .info h1 { font-size: 21px; margin: 2px 0 8px; font-weight: 800; line-height: 1.3; }
  .info p  { font-size: 13.5px; color: var(--muted); line-height: 1.6; margin: 0 0 18px; }

  /* ── format toggle ── */
  .format-toggle { display: flex; gap: 12px; margin-bottom: 18px; }
  .fmt-btn {
    flex: 1; border: 1.5px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); border-radius: 12px;
    padding: 16px 14px; cursor: pointer; text-align: left; position: relative; color: var(--text);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: all .18s ease;
    box-shadow: 0 4px 16px rgba(0,0,0,.25);
  }
  .fmt-btn:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.2); background: rgba(255,255,255,.06); }
  .fmt-btn .fmt-name { font-weight: 800; font-size: 15.5px; display: flex; align-items: center; gap: 8px; }
  .fmt-btn .fmt-sub  { font-size: 12px; color: var(--muted); margin-top: 3px; font-family: 'JetBrains Mono', monospace; }
  .fmt-btn.mp4.active { border-color: rgba(255,107,107,.5); box-shadow: 0 0 0 1px rgba(255,107,107,.2) inset, 0 10px 24px -14px rgba(255,107,107,.4); background: rgba(255,107,107,.12); }
  .fmt-btn.mp3.active { border-color: rgba(62,166,255,.5); box-shadow: 0 0 0 1px rgba(62,166,255,.2) inset, 0 10px 24px -14px rgba(62,166,255,.35); background: rgba(62,166,255,.12); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .fmt-btn.mp4 .dot { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .fmt-btn.mp3 .dot { background: var(--blue); box-shadow: 0 0 8px var(--blue); }

  /* ── quality grid ── */
  .quality-label { font-family: 'Caveat', cursive; font-size: 19px; color: var(--muted); margin: 2px 0 14px; }
  .quality-grid  { display: flex; flex-wrap: wrap; gap: 10px; }
  .q-btn {
    flex: 1 1 calc(25% - 10px);
    min-width: 80px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.04);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 14px 10px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
    text-align: center;
    color: var(--text);
    transition: all .2s ease;
    font-family: 'JetBrains Mono', monospace;
    box-shadow: 0 4px 16px rgba(0,0,0,.25);
  }
  .q-btn small { display: block; font-weight: 500; color: var(--muted); font-size: 10.5px; margin-top: 4px; font-family: 'Plus Jakarta Sans', sans-serif; }
  .q-btn:hover {
    border-color: rgba(255,107,107,.45);
    background: rgba(255,107,107,.1);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,.35), 0 0 0 1px rgba(255,107,107,.15) inset;
  }
  .q-btn.selected {
    background: rgba(255,107,107,.15);
    color: var(--red-light);
    border-color: rgba(255,107,107,.5);
    box-shadow: 0 10px 28px -12px rgba(255,107,107,.5), 0 0 0 1px rgba(255,107,107,.2) inset;
  }
  .q-btn.selected small { color: var(--red-soft); }
  .quality-grid.mp3 .q-btn.selected {
    background: rgba(62,166,255,.15);
    color: var(--blue);
    border-color: rgba(62,166,255,.5);
    box-shadow: 0 10px 28px -12px rgba(62,166,255,.4), 0 0 0 1px rgba(62,166,255,.2) inset;
  }
  .quality-grid.mp3 .q-btn.selected small { color: #6db8ff; }
  .quality-grid.mp3 .q-btn:hover {
    border-color: rgba(62,166,255,.45);
    background: rgba(62,166,255,.1);
    box-shadow: 0 8px 24px rgba(0,0,0,.35), 0 0 0 1px rgba(62,166,255,.15) inset;
  }

  /* ── download CTA ── */
  .download-cta {
    margin-top: 18px; width: 100%; border: 1px solid rgba(255,107,107,.4); padding: 16px; border-radius: 12px;
    font-weight: 800; font-size: 15px; letter-spacing: .3px; color: var(--red-light); cursor: pointer;
    background: rgba(255,107,107,.12);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 14px 32px -16px rgba(255,107,107,.45), 0 0 0 1px rgba(255,107,107,.1) inset;
    transition: all .2s ease;
  }
  .download-cta:hover { transform: translateY(-2px); box-shadow: 0 18px 36px -16px rgba(255,107,107,.55), 0 0 0 1px rgba(255,107,107,.15) inset; }
  .download-cta.mp3   { border-color: rgba(62,166,255,.4); color: var(--blue); background: rgba(62,166,255,.12); box-shadow: 0 14px 32px -16px rgba(62,166,255,.4), 0 0 0 1px rgba(62,166,255,.1) inset; }
  .download-cta:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  
  .download-cta.loading {
    background-image: 
      linear-gradient(45deg, rgba(255,255,255,.12) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.12) 50%, rgba(255,255,255,.12) 75%, transparent 75%, transparent),
      rgba(255,107,107,.15);
    background-size: 40px 40px, 100% 100%;
    animation: scan 1s linear infinite;
    cursor: wait; pointer-events: none;
  }
  .download-cta.mp3.loading {
    background-image: 
      linear-gradient(45deg, rgba(0,0,0,.1) 25%, transparent 25%, transparent 50%, rgba(0,0,0,.1) 50%, rgba(0,0,0,.1) 75%, transparent 75%, transparent),
      rgba(62,166,255,.15);
  }
  
  .download-hint {
    display: none; font-size: 12px; color: var(--red); margin-top: 12px;
    text-align: center; font-family: 'JetBrains Mono', monospace; animation: blink 2s infinite;
  }
  .download-hint.mp3 { color: var(--blue); }

  footer {
    text-align: center; padding: 26px; font-family: 'Caveat', cursive; font-size: 18px;
    color: #454b55; position: relative; z-index: 2;
  }

  /* ── responsive ── */
  @media (max-width: 760px) {
    .result { grid-template-columns: 1fr; }
    .quality-grid { grid-template-columns: repeat(2,1fr); }
  }
</style>
</head>
<body>

  <div class="grid-overlay"></div>
  <div class="blob" style="width:340px;height:340px;top:40px;left:-100px;background:var(--red);"></div>
  <div class="blob" style="width:300px;height:300px;top:340px;right:-110px;background:var(--blue);animation:driftSlow 12s ease-in-out infinite;"></div>
  <div class="glyph" style="top:110px;right:16%;font-size:30px;color:var(--red);">♪</div>
  <div class="glyph" style="top:540px;left:6%;font-size:34px;color:var(--blue);animation-delay:.6s;">♫</div>
  <div class="glyph" style="bottom:120px;right:10%;font-size:28px;color:var(--red);animation-delay:.3s;">♩</div>

  <header>
    <div>
      <div class="logo">Media<span>Hub</span></div>
      <div class="tagline">paste a link, pick a format, done.</div>
    </div>
    <div class="status"><span class="led"></span><span id="statusLabel">ready</span></div>
  </header>

  <main>
    <!-- URL input -->
    <div class="search-row">
      <input id="urlInput" type="text" placeholder="paste a YouTube link…">
    </div>
    <div class="hint" id="hintText">— paste a link above to fetch video info —</div>

    <!-- Status bar -->
    <div class="status-bar" id="statusBar">
      <div class="spinner" id="spinner"></div>
      <span id="statusMsg"></span>
    </div>

    <!-- Result card (hidden until info loads) -->
    <div class="result hidden" id="resultCard">
      <div class="thumb-wrap" id="thumbWrap">
        <span class="thumb-placeholder" id="thumbPlaceholder">thumbnail</span>
        <img id="thumbImg" src="" alt="thumbnail" style="display:none;">
        <div class="thumb-badge" id="thumbBadge">0:00</div>
        <button class="thumb-dl-btn" id="thumbDlBtn" title="Download thumbnail">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </button>
      </div>

      <div class="info">
        <h1 id="videoTitle">—</h1>
        <p id="videoDesc">—</p>

        <div class="format-toggle">
          <button class="fmt-btn mp4 active" id="mp4Tab" onclick="setFormat('mp4')">
            <div class="fmt-name"><span class="dot"></span>MP4 Download</div>
            <div class="fmt-sub">video · pick a resolution</div>
          </button>
          <button class="fmt-btn mp3" id="mp3Tab" onclick="setFormat('mp3')">
            <div class="fmt-name"><span class="dot"></span>MP3 Download</div>
            <div class="fmt-sub">audio only · pick a bitrate</div>
          </button>
        </div>

        <div class="quality-label">choose a quality —</div>
        <div class="quality-grid" id="qualityGrid"></div>

        <button class="download-cta" id="ctaBtn" onclick="startDownload()">Download MP4</button>
        <div class="download-hint" id="downloadHint">processing media... this might take a moment.</div>
      </div>
    </div>
  </main>

  <footer>made with a little too much Caveat font — for personal, licensed content only</footer>

<script>
  const API_BASE = 'http://localhost:3001/api';

  // ── quality presets ──
  const MP4_QUALITIES = [
    { label:'144p',   sub:'small',   itag:'q144' },
    { label:'360p',   sub:'ok',      itag:'q360' },
    { label:'480p',   sub:'good',    itag:'q480' },
    { label:'720p',   sub:'sharp',   itag:'q720' },
    { label:'1080p',  sub:'full hd', itag:'q1080' },
    { label:'1440p',  sub:'2k',      itag:'q1440' },
    { label:'2160p',  sub:'4k',      itag:'q2160' },
    { label:'source', sub:'original',itag:'qsource' },
  ];
  const MP3_QUALITIES = [
    { label:'96',   sub:'kbps', itag:'mp3-96' },
    { label:'128',  sub:'kbps', itag:'mp3-128' },
    { label:'192',  sub:'kbps', itag:'mp3-192' },
    { label:'256',  sub:'kbps', itag:'mp3-256' },
    { label:'320',  sub:'kbps', itag:'mp3-320' },
    { label:'V0',   sub:'vbr', itag:'mp3-V0' },
    { label:'FLAC', sub:'lossless', itag:'mp3-FLAC' },
    { label:'WAV',  sub:'raw', itag:'mp3-WAV' },
  ];

  let currentFormat  = 'mp4';
  let selectedQ      = null;
  let currentUrl     = '';
  let videoInfo      = null;
  let typingTimer;

  // ── helpers ──
  function fmtTime(secs) {
    if (!secs) return '0:00';
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = secs % 60;
    return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
             : `${m}:${String(s).padStart(2,'0')}`;
  }

  function setStatusLabel(text, color) {
    const el = document.getElementById('statusLabel');
    el.textContent = text;
    el.style.color = color || '';
  }

  function showBar(type, msg) {
    const bar = document.getElementById('statusBar');
    bar.className = 'status-bar ' + type;
    document.getElementById('statusMsg').textContent = msg;
    document.getElementById('spinner').style.display = type === 'loading' ? 'block' : 'none';
  }

  function hideBar() {
    document.getElementById('statusBar').className = 'status-bar';
  }

  function handleInput() {
    clearTimeout(typingTimer);
    typingTimer = setTimeout(fetchInfo, 500);
  }

  // ── quality grid ──
  function renderQuality(fmt) {
    const grid = document.getElementById('qualityGrid');
    grid.className = 'quality-grid' + (fmt === 'mp3' ? ' mp3' : '');
    grid.innerHTML = '';

    // Use video info formats for mp4 if available, else default presets
    let list;
    if (fmt === 'mp4' && videoInfo && videoInfo.formats && videoInfo.formats.length) {
      list = videoInfo.formats.map(f => ({ label: f.quality, sub: f.type || 'mp4', itag: f.itag }));
    } else {
      list = fmt === 'mp4' ? MP4_QUALITIES : MP3_QUALITIES;
    }

    list.forEach((q, i) => {
      const b = document.createElement('button');
      b.className = 'q-btn';
      b.style.cssText = `animation:reveal .35s ease forwards ${i * 0.03}s; opacity:0;`;
      b.innerHTML = `${q.label}<small>${q.sub}</small>`;
      b.dataset.itag  = q.itag || q.label;
      b.dataset.label = q.label;
      b.onclick = () => {
        [...grid.children].forEach(c => c.classList.remove('selected'));
        b.classList.add('selected');
        selectedQ = { label: q.label, itag: q.itag || q.label };
        updateCta();
      };
      grid.appendChild(b);
    });

    // Default selection: index 2 for mp4, index 2 for mp3
    const defIdx = 2;
    if (grid.children[defIdx]) {
      grid.children[defIdx].classList.add('selected');
      selectedQ = { label: list[defIdx].label, itag: list[defIdx].itag || list[defIdx].label };
    }
    updateCta();
  }

  function updateCta() {
    const cta = document.getElementById('ctaBtn');
    cta.className = 'download-cta' + (currentFormat === 'mp3' ? ' mp3' : '');
    cta.textContent = `Download ${currentFormat.toUpperCase()}${selectedQ ? ' • ' + selectedQ.label : ''}`;
    
    const hint = document.getElementById('downloadHint');
    hint.className = 'download-hint' + (currentFormat === 'mp3' ? ' mp3' : '');
  }

  function setFormat(fmt) {
    currentFormat = fmt;
    document.getElementById('mp4Tab').classList.toggle('active', fmt === 'mp4');
    document.getElementById('mp3Tab').classList.toggle('active', fmt === 'mp3');
    renderQuality(fmt);
  }

  // ── fetch video info ──
  async function fetchInfo() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url || url === currentUrl) return;
    currentUrl = url;

    document.getElementById('hintText').style.display = 'none';
    document.getElementById('resultCard').classList.add('hidden');
    showBar('loading', 'Fetching video info…');
    setStatusLabel('fetching…', 'var(--red)');

    try {
      const res  = await fetch(`${API_BASE}/video-info?url=${encodeURIComponent(url)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to fetch video info');

      videoInfo = data;
      populateCard(data);
      hideBar();
      setStatusLabel('ready');
      document.getElementById('resultCard').classList.remove('hidden');
    } catch (err) {
      showBar('error', err.message || 'Could not fetch video info. Check the URL and try again.');
      setStatusLabel('error', '#f87171');
    }
  }

  function populateCard(info) {
    document.getElementById('videoTitle').textContent = info.title || 'Untitled';
    document.getElementById('videoDesc').textContent  = info.description
      ? info.description.slice(0, 180) + (info.description.length > 180 ? '…' : '')
      : 'No description available.';

    document.getElementById('thumbBadge').textContent = fmtTime(info.lengthSeconds || 0);

    const img  = document.getElementById('thumbImg');
    const ph   = document.getElementById('thumbPlaceholder');
    if (info.thumbnail) {
      img.src = info.thumbnail;
      img.style.display = 'block';
      ph.style.display  = 'none';
    } else {
      img.style.display = 'none';
      ph.style.display  = '';
    }

    currentFormat = 'mp4';
    document.getElementById('mp4Tab').classList.add('active');
    document.getElementById('mp3Tab').classList.remove('active');
    renderQuality('mp4');
  }

  // ── download ──
  async function startDownload() {
    if (!currentUrl || !selectedQ) return;

    const cta = document.getElementById('ctaBtn');
    const hint = document.getElementById('downloadHint');
    const orig = cta.textContent;
    
    cta.classList.add('loading');
    cta.textContent = 'Processing & Downloading...';
    hint.style.display = 'block';

    try {
      const link = document.createElement('a');
      link.href = `${API_BASE}/download?url=${encodeURIComponent(currentUrl)}&itag=${selectedQ.itag}`;
      link.download = '';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      // Reset UI after enough time has passed for the browser download prompt to appear
      setTimeout(() => {
        cta.classList.remove('loading');
        cta.textContent = orig;
        hint.style.display = 'none';
      }, 6000);
    } catch (err) {
      showBar('error', 'Download failed. Please try again.');
      cta.classList.remove('loading');
      cta.textContent = orig;
      hint.style.display = 'none';
    }
  }

  // ── input events ──
  document.getElementById('urlInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') fetchInfo();
  });
  document.getElementById('urlInput').addEventListener('paste', () => {
    setTimeout(fetchInfo, 50);
  });

  // ── thumbnail download ──
  document.getElementById('thumbDlBtn').addEventListener('click', () => {
    if (!currentUrl) return;
    const apiUrl = `${API_BASE}/thumbnail?url=${encodeURIComponent(currentUrl)}`;
    const a = document.createElement('a');
    a.href = apiUrl;
    a.download = 'thumbnail';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });
</script>
</body>
</html>
